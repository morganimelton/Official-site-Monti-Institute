name: Import Insights for review
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: monti-blog-import
  cancel-in-progress: false
jobs:
  import:
    if: vars.BLOG_IMPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r _blog/requirements.txt
      - run: python -m unittest discover -s _blog/tests
      - name: Check for an outstanding review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/insights-"))] | length')
          echo "pending=$count" >> "$GITHUB_OUTPUT"
      - name: Import into pending review only
        if: steps.review.outputs.pending == '0'
        env:
          GRANDRANKER_RSS_URL: ${{ secrets.GRANDRANKER_RSS_URL }}
        run: python _blog/manage.py import
      - name: Open review pull request
        if: steps.review.outputs.pending == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- _blog/articles.json; then exit 0; fi
          branch="automation/insights-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _blog/articles.json
          git commit -m 'Import Insights articles for medical review'
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title 'Insights: articles awaiting medical review' --body 'New or updated RSS content is held in _blog/articles.json. Review the exact pending version, approve with _blog/manage.py approve, and commit the generated blog pages before merging. Merging pending data alone does not publish articles. See _blog/README.md.'
